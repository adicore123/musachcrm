<div id="view-vehicle-check" class="hidden">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-6 mb-8 fade-up" style="animation-delay: 0.1s;">
    <div>
      <h1 class="text-3xl font-bold tracking-tight text-brand-text mb-1">בדיקת רכב</h1>
      <p class="text-brand-muted text-sm">הזינו מספר רישוי לצפייה בפרטי הרכב ומידות הצמיגים</p>
    </div>
  </div>

  <div class="bg-brand-surface border border-brand-border rounded-2xl shadow-sm p-6 sm:p-8 mb-6 fade-up" style="animation-delay: 0.15s;">
    <div class="max-w-md mx-auto">
      <label class="block text-sm font-semibold text-brand-text mb-2">מספר רישוי</label>
      <div class="flex gap-3">
        <input id="vc-plate-input" type="text" placeholder="123-45-678" dir="ltr" maxlength="10"
          class="flex-1 bg-brand-bg border border-brand-border rounded-xl px-4 py-4 text-xl text-brand-text placeholder:text-brand-muted font-mono tracking-[0.25em] text-center uppercase transition-all focus:border-brand-c2 focus:ring-2 focus:ring-brand-c2/30"
          oninput="this.value=this.value.toUpperCase()"
          onkeydown="if(event.key==='Enter') lookupVehicle()">
        <button type="button" onclick="lookupVehicle()"
          class="gradient-btn px-6 py-4 rounded-xl text-brand-text font-bold text-sm shadow-pastel border border-white/50 hover:opacity-90 transition-all flex items-center gap-2 whitespace-nowrap">
          <span id="vc-btn-label">חפש רכב</span>
          <div id="vc-spin" class="hidden w-4 h-4 border-2 border-brand-text border-t-transparent rounded-full spin"></div>
        </button>
      </div>
      <div id="vc-error" class="hidden mt-3 text-sm text-brand-danger font-semibold text-center"></div>
    </div>
  </div>

  <div id="vc-results" class="hidden space-y-5 fade-up">

    <div class="bg-brand-surface border border-brand-border rounded-2xl shadow-sm overflow-hidden">
      <div class="px-6 py-4 border-b border-brand-border bg-brand-bg flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-brand-c2/40 flex items-center justify-center">
          <svg class="w-5 h-5 text-indigo-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0"/></svg>
        </div>
        <div>
          <div class="font-bold text-brand-text" id="vc-title">—</div>
          <div class="text-xs text-brand-muted font-mono" id="vc-plate-display" dir="ltr"></div>
        </div>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-0 divide-y sm:divide-y-0 sm:divide-x divide-brand-border rtl:sm:divide-x-reverse">
        <div class="p-5">
          <div class="text-[10px] text-brand-muted uppercase tracking-wider mb-1">יצרן</div>
          <div id="vc-make" class="text-base font-bold text-brand-text">—</div>
        </div>
        <div class="p-5">
          <div class="text-[10px] text-brand-muted uppercase tracking-wider mb-1">דגם</div>
          <div id="vc-model" class="text-base font-bold text-brand-text">—</div>
        </div>
        <div class="p-5">
          <div class="text-[10px] text-brand-muted uppercase tracking-wider mb-1">שנת ייצור</div>
          <div id="vc-year" class="text-base font-bold text-brand-text">—</div>
        </div>
        <div class="p-5">
          <div class="text-[10px] text-brand-muted uppercase tracking-wider mb-1">צבע</div>
          <div id="vc-color" class="text-base font-bold text-brand-text">—</div>
        </div>
      </div>
    </div>

    <div class="rounded-2xl overflow-hidden shadow-pastel" style="background:#7BC9EA; border:1px solid rgba(123,145,234,0.3)">
      <div class="px-6 py-4 flex items-center gap-3" style="border-bottom:1px solid rgba(100,100,255,0.15)">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:rgba(255,255,255,0.5)">
          <svg class="w-5 h-5" style="color:#0c4a6e" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" stroke-width="2"/>
            <circle cx="12" cy="12" r="4" stroke-width="2"/>
            <path stroke-linecap="round" stroke-width="2" d="M12 2v4M12 18v4M2 12h4M18 12h4"/>
          </svg>
        </div>
        <span class="font-bold text-lg" style="color:#1e1b4b">מידות צמיגים</span>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 p-6">
        <div class="bg-white/60 rounded-xl p-5 border border-white/70 shadow-sm">
          <div class="text-xs font-bold uppercase tracking-wider mb-3" style="color:#4338ca">צמיג קדמי</div>
          <div id="vc-tire-front" class="text-3xl font-black tracking-tight" style="color:#1e1b4b; font-variant-numeric: tabular-nums; letter-spacing:-0.02em">—</div>
        </div>
        <div class="bg-white/60 rounded-xl p-5 border border-white/70 shadow-sm">
          <div class="text-xs font-bold uppercase tracking-wider mb-3" style="color:#4338ca">צמיג אחורי</div>
          <div id="vc-tire-rear" class="text-3xl font-black tracking-tight" style="color:#1e1b4b; font-variant-numeric: tabular-nums; letter-spacing:-0.02em">—</div>
        </div>
      </div>
    </div>

    <div id="vc-test-card" class="rounded-2xl p-5 flex items-center gap-4 border shadow-sm">
      <div id="vc-test-icon" class="text-3xl">—</div>
      <div>
        <div class="text-xs font-bold text-brand-muted uppercase tracking-wider mb-0.5">תוקף טסט</div>
        <div id="vc-test" class="text-xl font-black text-brand-text">—</div>
      </div>
    </div>

    <div class="bg-brand-surface border border-brand-border rounded-2xl shadow-sm p-6">
      <div class="text-xs font-bold text-brand-muted uppercase tracking-wider mb-4">כל הנתונים הטכניים</div>
      <div id="vc-raw-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3"></div>
    </div>
  </div>
</div>
