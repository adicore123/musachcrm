<div id="view-appointments" class="hidden">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-6 mb-8 fade-up" style="animation-delay: 0.1s;">
    <div>
      <h1 class="text-3xl font-bold tracking-tight text-brand-text mb-1">ניהול תורים</h1>
      <p class="text-brand-muted text-sm">תיאום ומעקב אחר תורי לקוחות במוסך</p>
    </div>
    <button type="button" onclick="openAppointmentModal()"
      class="gradient-btn group relative flex items-center justify-center gap-2 text-brand-text font-bold px-6 py-3 rounded-xl text-sm shadow-pastel transition-all duration-300 w-full sm:w-auto overflow-hidden hover:opacity-90 border border-white/50">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
      </svg>
      <span>תור חדש</span>
    </button>
  </div>

  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6 mb-8 fade-up" style="animation-delay: 0.2s;">
    <div class="rounded-2xl p-6 shadow-pastel relative overflow-hidden" style="background:#7BC9EA; border:1px solid rgba(123,145,234,0.3)">
      <div class="absolute -top-4 -left-4 w-20 h-20 rounded-full opacity-25" style="background:#7B91EA"></div>
      <div class="flex justify-between items-start mb-4 relative z-10">
        <div class="text-sm font-semibold" style="color:#0c4a6e">סה״כ תורים</div>
        <div class="p-2 rounded-lg" style="background:rgba(255,255,255,0.65); color:#0c4a6e">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        </div>
      </div>
      <div id="apt-stat-total" class="text-4xl font-black tracking-tight relative z-10" style="color:#0c4a6e">—</div>
    </div>
    <div class="bg-brand-surface border border-brand-border rounded-2xl p-6 shadow-sm relative overflow-hidden">
      <div class="absolute -bottom-4 -right-4 w-20 h-20 rounded-full opacity-40" style="background:#e2e8f0"></div>
      <div class="flex justify-between items-start mb-4 relative z-10">
        <div class="text-sm font-semibold text-brand-muted">ממתינים</div>
        <div class="p-2 rounded-lg bg-sky-100 text-sky-700">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
      </div>
      <div id="apt-stat-scheduled" class="text-4xl font-black tracking-tight relative z-10 text-sky-700">—</div>
    </div>
    <div class="bg-brand-surface border border-brand-border rounded-2xl p-6 shadow-sm relative overflow-hidden">
      <div class="flex justify-between items-start mb-4 relative z-10">
        <div class="text-sm font-semibold text-brand-muted">בביצוע</div>
        <div class="p-2 rounded-lg bg-amber-100 text-amber-700">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        </div>
      </div>
      <div id="apt-stat-inprogress" class="text-4xl font-black tracking-tight relative z-10 text-amber-700">—</div>
    </div>
    <div class="bg-brand-surface border border-brand-border rounded-2xl p-6 shadow-sm relative overflow-hidden">
      <div class="flex justify-between items-start mb-4 relative z-10">
        <div class="text-sm font-semibold text-brand-muted">הושלמו</div>
        <div class="p-2 rounded-lg bg-brand-bg text-brand-success">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
      </div>
      <div id="apt-stat-completed" class="text-4xl font-black tracking-tight relative z-10 text-brand-success">—</div>
    </div>
  </div>

  <div class="bg-brand-surface border border-brand-border rounded-2xl shadow-sm fade-up flex flex-col" style="animation-delay: 0.3s; min-height: 500px;">
    <div class="p-5 border-b border-brand-border">
      <div class="relative max-w-md">
        <svg class="absolute right-4 top-1/2 -translate-y-1/2 w-5 h-5 text-brand-muted pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input id="search-appointments" type="text" placeholder="חיפוש לפי שם לקוח, סוג שירות..."
          class="w-full bg-brand-bg border border-brand-border rounded-xl pr-12 pl-4 py-3 text-sm text-brand-text placeholder:text-brand-muted transition-all"
          oninput="filterAppointmentsTable()">
      </div>
    </div>
    <div class="overflow-x-auto flex-1 rounded-b-2xl">
      <table class="w-full text-right border-collapse">
        <thead>
          <tr class="bg-brand-bg/50 border-b border-brand-border">
            <th class="text-xs font-bold text-brand-muted px-6 py-4 uppercase tracking-wider whitespace-nowrap">לקוח</th>
            <th class="text-xs font-bold text-brand-muted px-6 py-4 uppercase tracking-wider hidden sm:table-cell whitespace-nowrap">תאריך ושעה</th>
            <th class="text-xs font-bold text-brand-muted px-6 py-4 uppercase tracking-wider hidden md:table-cell whitespace-nowrap">סוג שירות</th>
            <th class="text-xs font-bold text-brand-muted px-6 py-4 uppercase tracking-wider whitespace-nowrap">סטטוס</th>
            <th class="text-xs font-bold text-brand-muted px-4 py-4 uppercase tracking-wider whitespace-nowrap">פעולות</th>
          </tr>
        </thead>
        <tbody id="apt-tbody"></tbody>
      </table>
      <div id="apt-loading" class="hidden flex-col items-center justify-center py-24 gap-4 text-brand-muted">
        <div class="w-10 h-10 border-4 border-brand-c2 border-t-brand-c3 rounded-full spin shadow-pastel-sm"></div>
        <div class="text-sm font-medium">טוען תורים...</div>
      </div>
      <div id="apt-empty" class="hidden flex-col items-center justify-center py-24 text-center">
        <div class="w-20 h-20 bg-brand-bg rounded-full flex items-center justify-center mb-5 border border-brand-border shadow-sm">
          <svg class="w-10 h-10 text-brand-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        </div>
        <div class="text-brand-text font-bold text-xl mb-2">אין תורים עדיין</div>
        <div class="text-brand-muted text-sm max-w-sm mx-auto">הוסיפו תור חדש באמצעות הכפתור למעלה.</div>
      </div>
    </div>
  </div>
</div>
